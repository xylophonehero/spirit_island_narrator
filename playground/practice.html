    border: 1px solid #5e2c2c;

<body>
<h1>Spirit Island Narrator</h1>
<p class="sub">Exercise 01 — model one game round as an XState v5 machine. Edit, run, make all 10 tests green. Your code auto-saves in this browser. (No type-checking here — that lives in the repo. These tests check behavior.)</p>

<textarea id="editor" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"></textarea>

<div class="bar">
  <button id="run">Run tests ▶</button>
  <button id="reset" class="secondary">Reset to problem</button>
  <button id="solution" class="secondary">Reveal solution…</button>
</div>
<div id="status">Loading toolchain…</div>
<div id="results"></div>
<div id="summary"></div>

<script type="text/plain" id="problem-code">/**
 * Exercise 01 — Model one Spirit Island round as a state machine.
 *
 * The round structure, straight from the rulebook:
 *
 *   spiritPhase → fastPowers → invaderPhase → slowPowers → timePasses → (next round)
 *                              └─ ravage → build → explore ─┘
 *
 * Your job — make every test green by:
 *
 * 1. Typing the machine in `setup({ types: { … } })`:
 *      context: { round: number; blightCount: number }
 *      events:  END_SPIRIT_PHASE | END_FAST_POWERS | RAVAGE | BUILD | EXPLORE
 *               | END_SLOW_POWERS | TIME_PASSES   (no payloads yet)
 *      input:   { startingBlight: number }
 *
 * 2. Implementing two named actions with `assign`:
 *      'addBlight'  — RAVAGE puts one blight on the island
 *      'nextRound'  — TIME_PASSES increments the round
 *
 * 3. Implementing one named guard:
 *      'islandWouldBeDestroyed' — true when the *next* blight would be the
 *      fifth (i.e. blightCount is already 4 or more)
 *
 * 4. Wiring the states:
 *      - initial context comes from input (round starts at 1)
 *      - invaderPhase is a NESTED state: ravage → build → explore
 *      - EXPLORE leaves the invaderPhase entirely, landing on slowPowers
 *      - RAVAGE first checks the guard: if the island would be destroyed,
 *        go to a top-level final state 'gameOver' (still adding the blight —
 *        the island falls as it burns). Otherwise add blight and move to build.
 *      - TIME_PASSES loops back to spiritPhase for the next round
 *
 * Hints (read one at a time, only when stuck):
 *
 * Hint 1: `setup({ types: { context: {} as …, events: {} as …, input: {} as … } })`
 *         — the `{} as Type` pattern is how XState v5 takes type-only params.
 *
 * Hint 2: `assign({ blightCount: ({ context }) => context.blightCount + 1 })`
 *         — import `assign` from 'xstate'. Reference actions by NAME in the
 *         machine config: `actions: 'addBlight'`.
 *
 * Hint 3: A guarded transition is an array — first match wins:
 *         RAVAGE: [
 *           { guard: 'islandWouldBeDestroyed', target: …, actions: … },
 *           { target: …, actions: … },
 *         ]
 *         Targeting a state OUTSIDE the nested parent needs an id ref:
 *         `target: '#gameRound.gameOver'`.
 */

  types: {

  },

    // TODO: 'islandWouldBeDestroyed'
  },
}).createMachine({
  id: 'gameRound',
  // TODO: context: ({ input }) => …
  initial: 'spiritPhase',
  states: {
    spiritPhase: {
      // TODO
    },
    // TODO: fastPowers, invaderPhase (nested!), slowPowers, timePasses, gameOver
  },

<script type="text/plain" id="solution-code">import { assign, setup } from 'xstate';

export const gameRoundMachine = setup({
  types: {
    context: {} as { round: number; blightCount: number },
    events: {} as
      | { type: 'END_SPIRIT_PHASE' }
      | { type: 'END_FAST_POWERS' }
      | { type: 'RAVAGE' }
      | { type: 'BUILD' }
      | { type: 'EXPLORE' }
      | { type: 'END_SLOW_POWERS' }
      | { type: 'TIME_PASSES' },
    input: {} as { startingBlight: number },
  },
  actions: {
    addBlight: assign({
      blightCount: ({ context }) => context.blightCount + 1,
    }),
    nextRound: assign({
      round: ({ context }) => context.round + 1,
    }),
  },
  guards: {
    islandWouldBeDestroyed: ({ context }) => context.blightCount >= 4,
  },
}).createMachine({
  id: 'gameRound',
  context: ({ input }) => ({
    round: 1,
    blightCount: input.startingBlight,
  }),
  initial: 'spiritPhase',
  states: {
    spiritPhase: {
      on: { END_SPIRIT_PHASE: { target: 'fastPowers' } },
    },
    fastPowers: {
      on: { END_FAST_POWERS: { target: 'invaderPhase' } },
    },
    invaderPhase: {
      initial: 'ravage',
      states: {
        ravage: {
          on: {
            RAVAGE: [
              {
                guard: 'islandWouldBeDestroyed',
                target: '#gameRound.gameOver',
                actions: 'addBlight',
              },
              { target: 'build', actions: 'addBlight' },
            ],
          },
        },
        build: {
          on: { BUILD: { target: 'explore' } },
        },
        explore: {
          on: { EXPLORE: { target: '#gameRound.slowPowers' } },
        },
      },
    },
    slowPowers: {
      on: { END_SLOW_POWERS: { target: 'timePasses' } },
    },
    timePasses: {
      on: { TIME_PASSES: { target: 'spiritPhase', actions: 'nextRound' } },
    },
    gameOver: {
      type: 'final',
    },
  },
});
</script>

<script type="module">
// xstate 5.32.5 + sucrase, bundled from the repo's own node_modules —
// the page works offline-ish and always matches the exercise's version.
const XSTATE_URL = new URL('./vendor/xstate.js', location.href).href;
const SUCRASE_URL = new URL('./vendor/sucrase.js', location.href).href;
const STORE_KEY = 'sin-ex01-code';

const $ = (id) => document.getElementById(id);
const editor = $('editor');
const statusEl = $('status');
const resultsEl = $('results');
const summaryEl = $('summary');

const problemCode = $('problem-code').textContent.trim() + '\n';
const solutionCode = $('solution-code').textContent.trim() + '\n';

editor.value = localStorage.getItem(STORE_KEY) ?? problemCode;
editor.addEventListener('input', () => localStorage.setItem(STORE_KEY, editor.value));

$('reset').onclick = () => {
  if (!confirm('Replace your code with the original problem?')) return;
  editor.value = problemCode;
  localStorage.setItem(STORE_KEY, editor.value);
};
$('solution').onclick = () => {
  if (!confirm('Teacher says: only after an honest attempt. Reveal the solution?')) return;
  editor.value = solutionCode;
  localStorage.setItem(STORE_KEY, editor.value);
};

// ── tiny test framework ────────────────────────────────────────────────
function deepEqual(a, b) {
  if (Object.is(a, b)) return true;
  if (typeof a !== 'object' || typeof b !== 'object' || a === null || b === null) return false;
  if (Array.isArray(a) !== Array.isArray(b)) return false;
  const ka = Object.keys(a), kb = Object.keys(b);
  if (ka.length !== kb.length) return false;
  return ka.every((k) => deepEqual(a[k], b[k]));
}
const show = (v) => { try { return JSON.stringify(v); } catch { return String(v); } };
function expect(actual) {
  return {
    toBe(expected) {
      if (!Object.is(actual, expected))
        throw new Error(`expected ${show(expected)}\nreceived ${show(actual)}`);
    },
    toEqual(expected) {
      if (!deepEqual(actual, expected))
        throw new Error(`expected ${show(expected)}\nreceived ${show(actual)}`);
    },
  };
}

// ── the same spec as exercises/01-xstate-warmup/machine.test.ts ────────
function buildTests(createActor, machine) {
  const startGame = (startingBlight = 0) => {
    const actor = createActor(machine, { input: { startingBlight } });
    actor.start();
    return actor;
  };
  const advanceToRavage = (actor) => {
    actor.send({ type: 'END_SPIRIT_PHASE' });
    actor.send({ type: 'END_FAST_POWERS' });
  };

  return [
    ['the shape of a round', 'begins in the spirit phase on round 1', () => {
      const actor = startGame();
      expect(actor.getSnapshot().value).toBe('spiritPhase');
      expect(actor.getSnapshot().context).toEqual({ round: 1, blightCount: 0 });
    }],
    ['the shape of a round', 'starts with the blight the island was dealt as input', () => {
      const actor = startGame(3);
      expect(actor.getSnapshot().context.blightCount).toBe(3);
    }],
    ['the shape of a round', 'moves spiritPhase → fastPowers → invaderPhase(ravage)', () => {
      const actor = startGame();
      actor.send({ type: 'END_SPIRIT_PHASE' });
      expect(actor.getSnapshot().value).toBe('fastPowers');
      actor.send({ type: 'END_FAST_POWERS' });
      expect(actor.getSnapshot().value).toEqual({ invaderPhase: 'ravage' });
    }],
    ['the shape of a round', 'steps through the invader phase: ravage → build → explore', () => {
      const actor = startGame();
      advanceToRavage(actor);
      actor.send({ type: 'RAVAGE' });
      expect(actor.getSnapshot().value).toEqual({ invaderPhase: 'build' });
      actor.send({ type: 'BUILD' });
      expect(actor.getSnapshot().value).toEqual({ invaderPhase: 'explore' });
    }],
    ['the shape of a round', 'exploring ends the invader phase, landing on slowPowers', () => {
      const actor = startGame();
      advanceToRavage(actor);
      actor.send({ type: 'RAVAGE' });
      actor.send({ type: 'BUILD' });
      actor.send({ type: 'EXPLORE' });
      expect(actor.getSnapshot().value).toBe('slowPowers');
    }],
    ['blight', 'ravaging adds one blight to the island', () => {
      const actor = startGame();
      advanceToRavage(actor);
      actor.send({ type: 'RAVAGE' });
      expect(actor.getSnapshot().context.blightCount).toBe(1);
    }],
    ['blight', 'the fifth blight destroys the island', () => {
      const actor = startGame(4);
      advanceToRavage(actor);
      actor.send({ type: 'RAVAGE' });
      const snapshot = actor.getSnapshot();
      expect(snapshot.value).toBe('gameOver');
      expect(snapshot.context.blightCount).toBe(5);
      expect(snapshot.status).toBe('done');
    }],
    ['blight', 'four blight is survivable — the round continues', () => {
      const actor = startGame(3);
      advanceToRavage(actor);
      actor.send({ type: 'RAVAGE' });
      expect(actor.getSnapshot().value).toEqual({ invaderPhase: 'build' });
      expect(actor.getSnapshot().context.blightCount).toBe(4);
    }],
    ['time passes', 'loops back to the spirit phase and increments the round', () => {
      const actor = startGame();
      advanceToRavage(actor);
      actor.send({ type: 'RAVAGE' });
      actor.send({ type: 'BUILD' });
      actor.send({ type: 'EXPLORE' });
      actor.send({ type: 'END_SLOW_POWERS' });
      expect(actor.getSnapshot().value).toBe('timePasses');
      actor.send({ type: 'TIME_PASSES' });
      expect(actor.getSnapshot().value).toBe('spiritPhase');
      expect(actor.getSnapshot().context.round).toBe(2);
    }],
    ['statechart discipline', 'ignores events that are out of phase (no ravaging during the spirit phase)', () => {
      const actor = startGame();
      actor.send({ type: 'RAVAGE' });
      expect(actor.getSnapshot().value).toBe('spiritPhase');
      expect(actor.getSnapshot().context.blightCount).toBe(0);
    }],
  ];
}

// ── toolchain ──────────────────────────────────────────────────────────
let transform, createActor;
const runBtn = $('run');
runBtn.disabled = true;
try {
  [{ transform }, { createActor }] = await Promise.all([
    import(SUCRASE_URL),
    import(XSTATE_URL),
  ]);
  statusEl.textContent = 'Ready. Edit the code, then run the tests.';
  runBtn.disabled = false;
} catch (e) {
  statusEl.innerHTML = '';
  resultsEl.innerHTML = `<div class="fatal">Could not load the toolchain  — reload the page.\n\n${e}</div>`;
}

runBtn.onclick = async () => {
  resultsEl.innerHTML = '';
  summaryEl.textContent = '';
  summaryEl.className = '';
  statusEl.textContent = 'Running…';
  let machine;
  try {
    const js = transform(editor.value, { transforms: ['typescript'] }).code
      .replace(/from\s+(['"])xstate\1/g, `from '${XSTATE_URL}'`);
    const url = URL.createObjectURL(new Blob([js], { type: 'text/javascript' }));
    let mod;
    try { mod = await import(url); } finally { URL.revokeObjectURL(url); }
    machine = mod.gameRoundMachine;
    if (!machine) throw new Error("Your file must `export const gameRoundMachine = …`");
  } catch (e) {
    statusEl.textContent = '';
    resultsEl.innerHTML = `<div class="fatal">Your code did not compile/load:\n\n${e?.message ?? e}</div>`;
    return;
  }

  let passed = 0;
  let lastGroup = '';
  for (const [group, name, fn] of buildTests(createActor, machine)) {
    if (group !== lastGroup) {
      lastGroup = group;
      resultsEl.insertAdjacentHTML('beforeend', `<div class="group"></div>`);
      resultsEl.lastChild.textContent = group;
    }
    const div = document.createElement('div');
    let err = null;
    try { fn(); passed++; } catch (e) { err = e; }
    div.className = `test ${err ? 'fail' : 'pass'}`;
    div.innerHTML = `<span class="mark">${err ? '❌' : '✅'}</span>`;
    div.append(name);
    if (err) {
      const pre = document.createElement('span');
      pre.className = 'err';
      pre.textContent = err.message ?? String(err);
      div.append(pre);
    }
    resultsEl.append(div);
  }
  const total = resultsEl.querySelectorAll('.test').length;
  statusEl.textContent = '';
  summaryEl.textContent = passed === total
    ? `🌒 ${passed}/${total} — the island dreams on. Exercise complete.`
    : `${passed}/${total} passing`;
  if (passed === total) summaryEl.className = 'allpass';
};
</script>
</body>
